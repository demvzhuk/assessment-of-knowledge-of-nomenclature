// ===== геометрия =====
const KX=lat=>111.32*Math.cos(lat*Math.PI/180), KY=110.57;
function d2s(p,a,b,lat0){ // расстояние точка-отрезок, км
 const k=KX(lat0),px=p[1]*k,py=p[0]*KY,ax=a[1]*k,ay=a[0]*KY,bx=b[1]*k,by=b[0]*KY;
 const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
 let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;t=Math.max(0,Math.min(1,t));
 return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function inPoly(p,g){let c=false;for(let i=0,j=g.length-1;i<g.length;j=i++){
 if((g[i][0]>p[0])!=(g[j][0]>p[0])&&p[1]<(g[j][1]-g[i][1])*(p[0]-g[i][0])/(g[j][0]-g[i][0])+g[i][1])c=!c;}return c;}
function dist(p,o){ // км до геометрии (0 если внутри полигона)
 let m=1e9;
 for(const g of o.g){
  if(o.k=="p"){m=Math.min(m,d2s(p,g[0],g[0],p[0]));continue;}
  if(o.k=="a"&&inPoly(p,g))return 0;
  const n=g.length,e=o.k=="a"?n:n-1;
  for(let i=0;i<e;i++)m=Math.min(m,d2s(p,g[i],g[(i+1)%n],p[0]));}
 return m;}

// ===== варианты =====
function hash(s){let h=2166136261;for(const c of s.toLowerCase().replace(/\s+/g,""))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeVariant(v){const R=rng(v*7919+13);let best=null;
 for(let t=0;t<300;t++){const out=[];
  for(const [lv,k] of [[1,4],[2,2],[3,2],[4,2]]){
   const pool=O.filter(o=>o.l==lv);
   for(let i=pool.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
   out.push(...pool.slice(0,k));}
  const cnt=f=>Math.max(...Object.values(out.reduce((m,o)=>(m[f(o)]=(m[f(o)]||0)+1,m),{})));
  if(!best)best=out;
  if(cnt(o=>o.c)<=3&&cnt(o=>o.t)<=3)return out;}
 return best;}

// ===== ход теста =====
let map,marker,tasks,cur,click,ans=[],st={};
const $=id=>document.getElementById(id);
$("go").onclick=()=>{
 const fio=$("fio").value.trim(),grp=$("grp").value.trim();
 if(fio.split(/\s+/).length<2||!grp){$("err").textContent="Введите ФИО полностью и группу";return;}
 const key="nom_"+hash(fio+grp);
 if(localStorage.getItem(key)){$("err").textContent="Этот студент уже проходил тест";return;}
 st={fio,grp,key,variant:hash(fio+grp)%NVAR+1};
 tasks=makeVariant(st.variant);cur=0;
 $("start").classList.add("hide");$("top").classList.remove("hide");$("map").classList.remove("hide");
 map=L.map("map",{minZoom:2,maxZoom:8,worldCopyJump:true}).setView([40,60],3);
 const at="Tiles © Esri";
 const relief=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}",{attribution:at,maxNativeZoom:13}).addTo(map);
 const phys=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}",{attribution:at,maxNativeZoom:8});
 map.createPane("outl");map.getPane("outl").style.zIndex=350;map.getPane("outl").style.pointerEvents="none";
 const ln=(a,o)=>L.layerGroup(a.map(c=>L.polyline(c.map(p=>[p[1],p[0]]),Object.assign({pane:"outl",interactive:false,weight:1.2},o))));
 const outl=L.layerGroup([ln(OUT.c,{color:"#222",weight:1.4}),ln(OUT.r,{color:"#1565c0",weight:1.3}),ln(OUT.l,{color:"#1565c0",weight:1.3})]).addTo(map);
 L.control.layers({"Рельеф":relief,"Физическая":phys},{"Контуры":outl},{position:"topright"}).addTo(map);
 map.on("click",e=>{click=e.latlng;marker&&marker.remove();marker=L.marker(e.latlng).addTo(map);$("ok").disabled=false;});
 show();};
function show(){$("task").textContent=tasks[cur].t+": "+tasks[cur].n;$("cnt").textContent=(cur+1)+" / "+tasks.length;$("ok").disabled=true;marker&&marker.remove();click=null;}
$("ok").onclick=()=>{
 const o=tasks[cur],lng=((click.lng+180)%360+360)%360-180,d=dist([click.lat,lng],o);
 ans.push({ts:new Date().toISOString(),fio:st.fio,group:st.grp,variant:st.variant,num:cur+1,obj_id:o.id,obj:o.n,type:o.t,level:o.l,lat:+click.lat.toFixed(4),lng:+lng.toFixed(4),dist_km:Math.round(d),buffer_km:o.r,correct:d<=o.r?1:0});
 if(++cur<tasks.length)show();else finish();};
async function finish(){
 localStorage.setItem(st.key,"1");localStorage.setItem(st.key+"_a",JSON.stringify(ans));
 const sc=ans.reduce((s,a)=>s+a.correct,0);
 $("top").classList.add("hide");$("map").classList.add("hide");$("end").classList.remove("hide");
 $("end").innerHTML="<h2>Готово</h2><p>Результат: <b>"+sc+" из "+ans.length+"</b></p><p id='s'>Отправка...</p>";
 try{if(!SCRIPT_URL)throw 0;await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({rows:ans})});
  $("s").textContent="Ответы отправлены преподавателю.";}
 catch(e){$("s").innerHTML="Не удалось отправить. Скачайте файл и передайте преподавателю: <button id='dl'>Скачать</button>";
  $("dl").onclick=()=>{const h=Object.keys(ans[0]),csv=[h.join(";")].concat(ans.map(a=>h.map(k=>a[k]).join(";"))).join("\n");
   const l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));l.download="nomenklatura_"+st.fio.replace(/\s+/g,"_")+".csv";l.click();};}}
</script></body></html>
